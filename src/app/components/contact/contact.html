<div class="container py-5 d-flex justify-content-center">
  <div class="w-75 text-center">
    @if (articleContact(); as article) {
    <h1>{{ article.titre }}</h1>
    <div class="trait my-3"></div>
    <h2 [innerHTML]="article.sousTitre | hashtags"></h2>
    <p>{{ article.contenu }}</p>
    <a class="buttons" [href]="article.href_lien">{{ article.libelle_lien }}</a>
    } @else {
      <p>Chargement...</p>
    }
  </div>
</div>
