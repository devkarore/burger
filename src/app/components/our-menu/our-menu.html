<div class="container py-5 d-flex justify-content-center">
  <div class="w-75 text-center">
    @if (articleOurMenu(); as article) {
    <h1> {{ article.titre }}</h1>
    <div class="trait my-3"></div>
    <h2 [innerHTML]="article.sousTitre | hashtags"></h2>
    <a class="buttons text-decoration-none btn btn-brand mt-3" [href]="article.href_lien">{{ article.libelle_lien }}</a>
    } @else {
      <p>Chargement...</p>
    }
  </div>
</div>
